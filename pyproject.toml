[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.isort]
known-first-party = ["assets", "bootstrap", "commands", "game", "injection", "lifecycle", "native_lifecycle", "render_state", "resource_safety", "runtime", "streaming"]
